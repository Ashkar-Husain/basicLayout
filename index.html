<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Basic Layout</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

</head>

<body>
    <div class="website-container">
        <header>
            <div class="left">
                <h2>Ashkar Coding</h2>
                <p>The place where we fulfill our dreams</p>
            </div>

            <div class="middle">
                <div class="header-search"><input type="search" oninput="highlightWords(this.value)"
                        placeholder="Search"></div>
            </div>
            <!-- Logo -->
            <div class="right">
                <img src="/ashkar_coding_new.png" alt="">
            </div>
        </header>
        <nav>
            <div class="left">
                <span id="hamburger" onclick="toggleSidebar()"><i class="fa fa-bars" aria-hidden="true"></i>
                </span>
                <h5>Hey There! I'm Using Website</h5>
            </div>
            <div class="middle">
                <ul id="navLi">
                    <li class="active">Home</li>
                    <li>About</li>
                    <li>Games</li>
                    <!-- <li>Settings</li> -->
                </ul>
            </div>
            <div class="right">
                <span onclick="toggleDropdown()">You <i class="fa fa-chevron-up" aria-hidden="true"></i></span>
                <div class="profile close">
                    <ul id="dropDownList">

                        <li><b><i class="fa fa-plus-square-o" aria-hidden="true"></i>
                            </b>Post</li>
                        <li><b><i class="fa fa-cog" aria-hidden="true"></i></b> Settings
                        </li>
                        <!-- <li id="signUpBtn"></li> -->
                    </ul>
                </div>

            </div>
        </nav>

        <main>
            <div class="sidebar">
                <aside>

                    <div class="aside-search">
                        <span><i class="fa fa-search" aria-hidden="true"></i>
                        </span>
                        <h4><input type="search" placeholder="Search"></h4>
                    </div>

                    <div class="dashboard">
                        <span><i class="fa fa-tachometer" aria-hidden="true"></i>
                        </span>
                        <h4>Dashboard</h4>
                    </div>

                    <div data-bs-target="#queriesModal" data-bs-toggle="modal" class="queries">
                        <span><i class="fa fa-quora" aria-hidden="true"></i>
                        </span>
                        <h4>Queries</h4>
                    </div>
                    <div class="accordions">
                        <!-- <div class="accordion">
                            <h4>Who is Ashkar Husain ? <small onclick="toggleAccordions(this)"><i
                                        class="fa fa-minus"></i></small></h4>
                            <p>Ashkr Husain is a web developer at clara softtech.</p>
                        </div>

                        <div class="accordion">
                            <h4>Who is Kamyab Husain ? <small onclick="toggleAccordions(this)"><i
                                        class="fa fa-minus"></i></small></h4>
                            <p>Kamyab Husain is a app developer at clara softtech.</p>
                        </div> -->
                    </div>

                    <hr>
                    <div class="logout">
                        <span><i class="fa fa-sign-out" aria-hidden="true"></i>
                        </span>
                        <h4>Logout</h4>
                    </div>

                    <div class="mode">
                        <Span><i class="fa fa-moon-o" aria-hidden="true"></i>
                        </Span>
                        <h4>Dark Mode</h4>
                        <!-- <Span><i class="fa fa-lightbulb-o" aria-hidden="true"></i> -->
                        </Span>
                    </div>

                    <div class="sidebar-img">
                        <img src="./sidebar_logo.png" alt="">
                    </div>
                </aside>
            </div>
            <div class="content">

            </div>
        </main>
        <footer>
            &copy; All rights reserved by Ashkar Husain
            <span>
                <script>document.write((new Date).getFullYear())</script>
            </span>
        </footer>
    </div>

    <!-- Queries Modal -->
    <div class="modal fade" id="queriesModal" data-bs-backdrop="static" data-bs-keyboard="false" tabindex="-1"
        aria-labelledby="queriesModalLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h1 class="modal-title fs-5" id="queriesModalLabel">Add a new query</h1>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <div class="row">
                        <div class="col-sm-12 mb-3">
                            <label class="mb-2" for="question">Question</label>
                            <input type="text" id="question" class="form-control">
                        </div>

                        <div class="col-sm-12">
                            <label class="mb-2" for="answer">Description</label>
                            <input type="text" id="answer" class="form-control">
                        </div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                    <button type="button" onclick="addNewQuery()" class="btn btn-primary">Submit</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Signup Modal -->
    <div class="modal fade" id="signupModal" data-bs-backdrop="static" data-bs-keyboard="false" tabindex="-1"
        aria-labelledby="signupModalLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h1 class="modal-title fs-5" id="signupModalLabel">Signup</h1>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <div class="row">
                        <div class="col-sm-12 mb-3">
                            <label class="mb-2" for="user_name">User Name<span class="error">*</span></label>
                            <input type="text" id="user_name" class="form-control">
                            <div id="user_name_error" class="error"></div>
                        </div>

                        <div class="col-sm-12 mb-3">
                            <label class="mb-2" for="user_mobile">User Mobile<span class="error">*</span></label>
                            <input type="text" id="user_mobile" class="form-control">
                             <div id="user_mobile_error" class="error"></div>
                        </div>


                        <div class="col-sm-12 mb-3">
                            <label class="mb-2" for="user_email">User Email<span class="error">*</span></label>
                            <input type="text" id="user_email" class="form-control">
                            <div id="user_email_error" class="error"></div>
                        </div>

                        <div class="col-sm-12 mb-3">
                            <label class="mb-2" for="user_password">Password<span class="error">*</span></label>
                            <input type="password" minlength="3" id="user_password" class="form-control">
                            <div id="user_password_error" class="error"></div>
                        </div>

                        <div class="col-sm-12 mb-3">
                            <label class="mb-2" for="confirm_password">Confirm Password<span class="error">*</span></label>
                            <input type="password" minlength="3" id="confirm_password" class="form-control">
                            <div id="confirm_password_error" class="error"></div>
                        </div>


                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                    <button type="button" onclick="signupYourself()" class="btn btn-primary">Submit</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
    <script src="script.js"></script>
</body>

</html>
